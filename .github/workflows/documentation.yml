name: Documentation

on:
  # Deploys on their own when a file RDoc renders changes on main.
  # Pull requests that change these files only build the docs (no deploy).
  # Keep this list in sync with rdoc_files in the Rakefile.
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "CONFIGURATION.md"
      - "CACHING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "LICENSE.txt"
      - "lib/**"
      - "assets/**"
      - "Rakefile"
      - "rakelib/**"
      - ".rdoc_options"
      - "cal-invite.gemspec"
      - ".github/workflows/documentation.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "CONFIGURATION.md"
      - "CACHING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "LICENSE.txt"
      - "lib/**"
      - "assets/**"
      - "Rakefile"
      - "rakelib/**"
      - ".rdoc_options"
      - "cal-invite.gemspec"
      - ".github/workflows/documentation.yml"
  # Manual run from the Actions tab, on any branch, with no release needed.
  workflow_dispatch:
  # Called by main.yml on release tags.
  workflow_call:
    inputs:
      ruby-version:
        description: 'Ruby version to use'
        required: false
        default: '3.3'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Deploys queue instead of cancelling, so a docs run from main cannot cancel
  # an in-flight release deploy. PR build checks cancel superseded runs.
  group: ${{ github.event_name == 'pull_request' && format('docs-check-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Remove .gitmodules if exists
      run: |
        if [ -f .gitmodules ]; then
          git rm --cached .gitmodules || true
          rm .gitmodules || true
        fi

    - name: Clean up submodule references
      run: |
        git submodule deinit -f --all || true
        git config --remove-section submodule.Example/calendar_app || true
        rm -rf .git/modules/Example/calendar_app || true

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ inputs.ruby-version || '3.3' }}

    - name: Install dependencies
      run: |
        rm -f doc/created.rid
        rm -rf doc docs _site rdoc
        bundle install

    # Same task as local `rake rdoc`. The README's images live in assets/.
    - name: Generate RDoc
      run: |
        bundle exec rake rdoc
        cp -R assets doc/

    # Pull requests only build the docs, so a broken RDoc build fails before merge.
    - name: Setup Pages
      if: github.event_name != 'pull_request'
      uses: actions/configure-pages@v5

    - name: Upload artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'doc/'

    - name: Deploy to GitHub Pages
      if: github.event_name != 'pull_request'
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Output URL
      if: github.event_name != 'pull_request'
      run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
