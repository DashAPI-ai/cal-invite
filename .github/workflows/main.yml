name: Ruby Gem

on:
  push:
    branches: ["main"]
    # Tag pushes are never filtered by paths, so a release always runs the tests.
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
      - "assets/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "assets/**"

# Cancel superseded runs for the same PR or branch. Tag runs are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ["3.3"]
        rails-version: ["6", "7", "8"]
      fail-fast: false
    timeout-minutes: 20
    env:
      BUNDLE_GEMFILE: gemfiles/Gemfile.rails${{ matrix.rails-version }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake test

  build:
    name: Build + Publish
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true
      - name: Prepare for publishing
        run: |
          mkdir -p $HOME/.gem
          touch $HOME/.gem/credentials
          chmod 0600 $HOME/.gem/credentials
          printf -- "---\n:rubygems_api_key: ${GEM_HOST_API_KEY}\n" > $HOME/.gem/credentials
      - name: Build and publish
        run: |
          gem build *.gemspec
          gem push *.gem
        env:
          GEM_HOST_API_KEY: "${{secrets.RUBYGEMS_AUTH_TOKEN}}"

  # Release-time docs. Docs also deploy on their own from main (see documentation.yml).
  documentation:
    name: Generate and Deploy Documentation
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/documentation.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      ruby-version: "3.3"
